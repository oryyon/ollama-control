name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  teste:
    name: Teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruleaza testele
        run: python -m unittest discover -s tests -v

  tipuri:
    name: Verificare de tipuri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruleaza Pyright
        run: npx --yes pyright@1.1.403
